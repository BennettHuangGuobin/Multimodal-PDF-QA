[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-pdf-qa"
version = "0.1.0"
description = "Local OCR-first PDF preparation and evidence indexing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
multimodal-pdf-qa = "multimodal_pdf_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
